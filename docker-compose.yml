services:

  backend:
    build:
      context: ./backend
    restart: unless-stopped

    environment:
      PORT: ${BACKEND_PORT}
      NODE_ENV: ${NODE_ENV}

    expose:
      - "${BACKEND_PORT}"

    volumes:
      - backend-data:/app/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
